<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>mini-mlop</title>
<!-- The server fills in {{assets}} (a folder named after a hash of the UI's
     files, cacheable forever) and {{boot}} (answers to the API requests this
     page's view starts with, so it does not have to come back for them). -->
<link rel="icon" href="{{assets}}/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{assets}}/style.css">
<!-- app.js imports these; asking now fetches them alongside it instead of after it. -->
<link rel="modulepreload" href="{{assets}}/app.js">
<link rel="modulepreload" href="{{assets}}/chart.js">
<link rel="modulepreload" href="{{assets}}/loading.js">
<link rel="modulepreload" href="{{assets}}/agent.js">
</head>
<body>
<header id="top">
  <a class="brand" href="/" aria-label="mini-mlop: all projects"><img src="{{assets}}/favicon.svg" alt="" width="22" height="22"><span id="brand-word" aria-hidden="true">mini-mlop</span></a>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <span class="grow"></span>
  <a id="nav-ask" href="#" role="button">Ask</a>
  <a id="nav-query" href="/query">Query</a>
  <a id="nav-settings" href="/settings">Settings</a>
</header>
<main id="view"></main>
<div id="tooltip" role="status" hidden></div>
<div id="peek" role="tooltip" hidden></div>
<noscript>mini-mlop needs JavaScript to draw your charts.</noscript>
<script type="application/json" id="boot">{{boot}}</script>
<script type="module" src="{{assets}}/app.js"></script>
</body>
</html>
