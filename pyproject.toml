[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-mlop"
version = "0.1.0"
description = "Lightweight, self-hosted ML experiment tracking: a Python logger and a dependency-free single-process server, with a query interface built for agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    {name = "mini-mlop contributors"},
]
keywords = ["mlops", "experiment-tracking", "self-hosted", "machine-learning"]

# The server (`mini_mlop_server`) needs nothing beyond the standard library.
# These two are for the logging client (`mini_mlop`).
dependencies = [
  "httpx",
  "psutil",
]

[project.optional-dependencies]
media = ["numpy", "pillow", "soundfile"]  # mlop.Image / mlop.Audio from arrays
gpu = ["nvidia-ml-py"]                    # NVIDIA utilisation metrics
full = ["numpy", "pillow", "soundfile", "nvidia-ml-py"]
dev = ["pytest", "numpy", "pillow"]

[project.scripts]
mini-mlop = "mini_mlop.__main__:main"
mini-mlop-server = "mini_mlop_server.__main__:main"

[tool.setuptools]
packages = ["mini_mlop", "mini_mlop.compat", "mini_mlop_server"]

[tool.setuptools.package-data]
mini_mlop_server = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/yych42/mini-mlop"
Repository = "https://github.com/yych42/mini-mlop.git"
