# docker compose -f deploy/compose.yaml up -d
# The API key is printed in the logs on first start:
#   docker compose -f deploy/compose.yaml logs mlop
services:
  mlop:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "2718:2718"
    volumes:
      - mlop-data:/data
    restart: unless-stopped

volumes:
  mlop-data:
